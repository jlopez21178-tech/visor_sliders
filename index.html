<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pruebas slide</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Link Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rizmyabdulla/fontawesome-pro@main/releases/v7.2.0/css/regular.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rizmyabdulla/fontawesome-pro@main/releases/v7.2.0/css/fontawesome.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rizmyabdulla/fontawesome-pro@main/releases/v7.2.0/css/chisel-regular.css"
    />
  </head>
  <body>
    <div id="map">
      <i id="loader" class="fa-regular fa-loader fa-2x"></i>
      <div id="search">
        <a
          href="http://ide.cime.es"
          target="_blank"
          aria-label="IDE Menorca"
        ></a>
      </div>
      <div id="ol-control-container">
        <div id="caption-container" class="ol-control ol-caption">
          <button
            id="caption-btn"
            title="Leyenda"
            class="fa-regular fa-square-info"
          ></button>
        </div>
      </div>
      <div class="slider-container">
        <input type="range" id="slider" />
        <i id="thumb-icon" class="fa-solid fa-grip-lines-vertical fa-lg"></i>
      </div>
      <i
        id="map-list-dropdown"
        class="fa-solid fa-angle-down dropdown-active"
      ></i>
      <div id="map-list-container" class="map-list-container">
        <div id="map-list"></div>
        <div class="selector-container">
          <input
            type="range"
            class="map-selector"
            id="base-selector"
            min="0"
            step="1"
            value="0"
          />
          <i id="thumb-base" class="thumb fa-solid fa-circle"></i>
          <input
            id="layer-selector"
            class="map-selector"
            type="range"
            min="0"
            step="1"
          />
          <i id="thumb-layer" class="thumb fa-regular fa-circle"></i>
        </div>
      </div>
      <i
        id="group-layer-btn"
        class="fa-regular fa-arrow-right-to-line fa-lg"
      ></i>
      <div id="group-layer-container" class="group-layer-container"></div>
      <div id="caption"><h2>Leyenda</h2></div>
    </div>
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer"></a>
      <div id="popup-content" class="ol-popup-content"></div>
      <div id="popup-info"></div>
    </div>
    <div id="error" class="error"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
